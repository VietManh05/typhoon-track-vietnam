[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "typhoon-vn-forecast-system"
version = "0.1.0"
description = "Vietnam-focused tropical cyclone track forecasting support system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Typhoon VN Forecast System contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "redis>=5,<6",
]
train = [
    "PyYAML>=6,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "torch>=2.4,<3",
]
ingestion = [
    "cdsapi>=0.7,<1",
    "netCDF4>=1.7,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17,<20",
    "xarray>=2024.6,<2027",
]
experiment = [
    "dvc>=3.53,<4",
    "mlflow>=2.15,<4",
]
dev = [
    "black>=24.10,<25",
    "flake8>=7.1,<8",
    "httpx>=0.27,<1",
    "isort>=5.13,<6",
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
]

[project.scripts]
typhoon-vn = "typhoon_vn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = [".git", ".venv", "build", "dist"]

[tool.setuptools.package-data]
typhoon_vn = ["dashboard/*"]
