name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,train,ingestion,experiment,dev]"
      - name: Lint
        run: |
          python -m flake8 src tests
          python -m isort --check-only src tests
          python -m black --check src tests
      - name: Unit and integration tests
        run: python -m pytest -q --junitxml=reports/phase6-pytest.xml
      - name: Model evaluation gate
        run: python scripts/run_phase3_validation.py
      - name: Installed wheel startup outside repository
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python scripts/verify_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/phase6-pytest.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: viz/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t typhoon-vn-api:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f infra/docker/worker.Dockerfile -t typhoon-vn-worker:${{ github.sha }} .
      - name: Validate production compose
        env:
          TYPHOON_ENV_FILE: configs/deploy.env.example
        run: docker compose --env-file configs/deploy.env.example -f docker-compose.prod.yml config --quiet
