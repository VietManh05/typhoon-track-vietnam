# Real-data benchmark: IBTrACS WP, whole storms split by final year.
# Run: python scripts/run_ibtracs_benchmark.py --data-root data --output-dir runs/ibtracs-benchmark

experiment:
  name: "ibtracs_wp_lstm_benchmark"
  seed: 42
  device: "auto"

dataset:
  input_len: 4
  horizon: [1, 2, 4, 8, 12]    # 6, 12, 24, 48, 72 h
  split_by_year: true          # latest years = test, the years before = val
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42

model:
  type: "LSTMTrackForecaster"
  hidden_size: 128
  num_layers: 2
  dropout: 0.2

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 10
  gradient_clip: 1.0
  scheduler: "cosine"
  log_every: 5

loss:
  reg_loss: "smooth_l1"
  reg_weight: 1.0
  cls_weight: 0.3

checkpoint:
  dir: "runs/ibtracs-benchmark/checkpoints"
  save_last: true
  save_best: true

mlflow:
  enabled: false
  tracking_uri: "mlruns"
  experiment_name: "typhoon_vn_benchmark"
